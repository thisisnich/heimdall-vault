<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=index.html">
    <title>Redirecting…</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const deck = params.get("deck");
        window.location.replace(deck ? `index.html#deck=${encodeURIComponent(deck)}` : "index.html");
    </script>
</head>
<body>
    <p><a href="index.html">Go to Flashcard Hub</a></p>
</body>
</html>
